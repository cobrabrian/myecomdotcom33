<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山林棲心 | 來自大地的純淨手作</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #8C7851; /* 溫暖木質棕 */
            --accent: #D4A373;  /* 蜂蜜金 */
            --bg: #FDFBF7;      /* 米白背景 */
            --text: #2D4032;    /* 深森林綠 */
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Noto Serif TC', serif;
        }

        /* 導覽列 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(253, 251, 247, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary);
            text-decoration: none;
        }

        .cart-icon-wrapper {
            position: relative;
            cursor: pointer;
            padding: 5px;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 英雄區 */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('https://images.unsplash.com/photo-1587049352846-4a222e784d38?auto=format&fit=crop&q=80&w=1600') center/cover no-repeat;
            color: white;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            font-weight: 300;
        }

        /* 產品清單 */
        .container {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 5%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 2rem;
            color: var(--primary);
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }

        .section-title h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: var(--accent);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: var(--shadow);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-category {
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .product-name {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: var(--text);
        }

        .product-price {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .add-to-cart {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-to-cart:hover {
            background: var(--text);
        }

        /* 購物車側邊欄 */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background: var(--white);
            box-shadow: -5px 0 30px rgba(0,0,0,0.1);
            z-index: 2000;
            transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.active {
            right: 0;
        }

        .cart-header {
            padding: 25px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-detail {
            flex-grow: 1;
        }

        .cart-item-name {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--primary);
        }

        .remove-item {
            cursor: pointer;
            color: #ccc;
            transition: color 0.3s;
        }

        .remove-item:hover {
            color: #ff4d4d;
        }

        .cart-footer {
            padding: 25px;
            border-top: 1px solid rgba(0,0,0,0.05);
            background: var(--bg);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .checkout-btn:active {
            transform: scale(0.98);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            z-index: 1500;
        }

        .overlay.active {
            display: block;
        }

        /* 提示彈窗 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            z-index: 3000;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            bottom: 50px;
        }

        @media (max-width: 480px) {
            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <nav>
        <a href="#" class="logo">山林棲心</a>
        <div class="cart-icon-wrapper" id="cart-icon">
            <i data-lucide="shopping-cart"></i>
            <span class="cart-count" id="cart-count">0</span>
        </div>
    </nav>

    <header class="hero">
        <h1>品味自然的純粹</h1>
        <p>每一滴蜂蜜，每一片茶葉，都蘊含著台灣土地最真實的記憶與溫度。</p>
    </header>

    <main class="container">
        <section class="section-title">
            <h2>嚴選農產</h2>
        </section>

        <div class="product-grid" id="product-grid">
            <!-- 產品由 JS 動態生成 -->
        </div>
    </main>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>購物袋</h3>
            <i data-lucide="x" class="remove-item" id="close-cart"></i>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- 購物車品項 -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>總計金額</span>
                <span id="cart-total-amount">NT$ 0</span>
            </div>
            <button class="checkout-btn" onclick="alert('結帳功能將在下一版本上線！')">前往結帳</button>
        </div>
    </div>

    <div class="toast" id="toast">已加入購物車</div>

    <script>
        // 初始化 Lucide 圖標
        lucide.createIcons();

        // 產品資料
        const products = [
            {
                id: 1,
                name: "深山野龍眼蜜",
                price: 880,
                category: "經典蜂蜜",
                image: "https://images.unsplash.com/photo-1587049352846-4a222e784d38?auto=format&fit=crop&q=80&w=600"
            },
            {
                id: 2,
                name: "春綻荔枝蜜",
                price: 750,
                category: "季節限定",
                image: "https://images.unsplash.com/photo-1558611848-73f7eb4001a1?auto=format&fit=crop&q=80&w=600"
            },
            {
                id: 3,
                name: "手採高山烏龍",
                price: 1200,
                category: "職人茗茶",
                image: "https://images.unsplash.com/photo-1594631252845-29fc458695d3?auto=format&fit=crop&q=80&w=600"
            },
            {
                id: 4,
                name: "森林百花蜜",
                price: 680,
                category: "經典蜂蜜",
                image: "https://images.unsplash.com/photo-1471943311424-646960669fba?auto=format&fit=crop&q=80&w=600"
            },
            {
                id: 5,
                name: "日月潭紅玉",
                price: 980,
                category: "職人茗茶",
                image: "https://images.unsplash.com/photo-1563911302283-d2bc129e7570?auto=format&fit=crop&q=80&w=600"
            },
            {
                id: 6,
                name: "冬日陳年蜜",
                price: 1500,
                category: "珍稀收藏",
                image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&q=80&w=600"
            }
        ];

        let cart = [];

        // 生成產品 HTML
        const productGrid = document.getElementById('product-grid');
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.image}" alt="${product.name}" class="product-img">
                <div class="product-info">
                    <div class="product-category">${product.category}</div>
                    <h3 class="product-name">${product.name}</h3>
                    <div class="product-price">NT$ ${product.price.toLocaleString()}</div>
                    <button class="add-to-cart" onclick="addToCart(${product.id})">
                        <i data-lucide="plus-circle" size="18"></i> 加入購物車
                    </button>
                </div>
            `;
            productGrid.appendChild(card);
        });
        lucide.createIcons();

        // 購物車功能
        const cartIcon = document.getElementById('cart-icon');
        const cartSidebar = document.getElementById('cart-sidebar');
        const closeCart = document.getElementById('close-cart');
        const overlay = document.getElementById('overlay');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartTotalAmount = document.getElementById('cart-total-amount');
        const cartCount = document.getElementById('cart-count');
        const toast = document.getElementById('toast');

        function toggleCart() {
            cartSidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        cartIcon.addEventListener('click', toggleCart);
        closeCart.addEventListener('click', toggleCart);
        overlay.addEventListener('click', toggleCart);

        window.addToCart = function(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            updateCart();
            showToast();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function updateCart() {
            // 更新數量標籤
            cartCount.innerText = cart.length;

            // 更新列表
            cartItemsContainer.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';
                itemEl.innerHTML = `
                    <img src="${item.image}" class="cart-item-img">
                    <div class="cart-item-detail">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">NT$ ${item.price.toLocaleString()}</div>
                    </div>
                    <i data-lucide="trash-2" class="remove-item" onclick="removeFromCart(${index})"></i>
                `;
                cartItemsContainer.appendChild(itemEl);
            });

            cartTotalAmount.innerText = `NT$ ${total.toLocaleString()}`;
            lucide.createIcons();
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
